services:
  db:
    image: postgis/postgis:18-3.6
    container_name: tastyroad_db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"

  api:
    build:
      context: .
      target: development
    container_name: tastyroad_api
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    container_name: tastyroad_nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgis_data:
  static_volume:
  media_volume:
