name: TastyRoad CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Backend - Test & Lint
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: tastyroad_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: dummy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Install spatial dependencies (GDAL/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev binutils libproj-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Security audit (pip-audit)
        run: pip-audit

      - name: Linting check (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests with coverage (Pytest)
        env:
          DJANGO_SECRET_KEY: "ci-insecure-secret-key-for-tests-only"
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tastyroad_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: dummy_password
        run: pytest --cov=core --cov=users --cov-report=term-missing --disable-warnings -q
